<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <style>
    .bg-route { stroke-dasharray: 190; animation: route 3.2s ease-in-out infinite; }
    .bg-pin { animation: drop 3.2s ease-in-out infinite; }
    @keyframes route { 0% { stroke-dashoffset: 190; } 60%, 100% { stroke-dashoffset: 0; } }
    @keyframes drop { 0%, 50% { transform: translateY(-14px); opacity: 0; } 62% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(-4px); } 78%, 100% { transform: translateY(0); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="160" height="160" fill="#3a2328"/>
  <path d="M0 132 L34 96 L52 112 L82 78 L112 108 L128 94 L160 124 L160 160 L0 160 Z" fill="#000" opacity=".18"/><g fill="none" stroke="#f0c66a" stroke-width=".8" opacity=".2"><path d="M8 30 Q30 20 44 34 T70 18"/><path d="M4 50 Q26 40 40 54 T64 40"/><path d="M110 60 Q128 50 142 62 T160 56"/></g>
  <circle cx="16" cy="112" r="3" fill="#f0c66a" opacity=".7"/><path class="bg-route" d="M16 112 C20 74 50 82 38 54 S72 22 120 44" fill="none" stroke="#f0c66a" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <g class="bg-pin"><path d="M120 44 C114 36 112 33 112 30 A8 8 0 0 1 128 30 C128 33 126 36 120 44 Z" fill="#f0975f"/><circle cx="120" cy="30" r="3" fill="#3a2328"/></g>
</svg>
