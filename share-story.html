<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <script src="desktop-site.js?v=20261114-csp1"></script>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <title>Share your best moment — Druk Voyages</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261002-mainlogo"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css?v=20261112-stories"/>
  <!-- Guest story upload page (R-18). Reached only from a trip QR code (share-story.html?t=<invite token>).
       Tokens, fields and photo rules: docs/ARCHITECTURE.md, "Guest stories (R-18)". Look: docs/DESIGN_SYSTEM.md. -->
  <style>
    .share-page { min-height: 100svh; display: flex; flex-direction: column; }
    .share-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px clamp(16px, 4vw, 40px); }
    .share-brand { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); min-height: 44px; }
    .share-brand img:first-child { width: 40px; height: 40px; }
    .share-brand .brand-wordmark { width: 150px; height: auto; }
    .share-lang select { min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: var(--fs-sm); }
    .share-lang select option { background: var(--paper); color: var(--ink); }
    .share-main { width: 100%; max-width: 560px; margin: 0 auto; padding: 24px 16px 72px; text-align: center; }
    .share-main .section-title { font-size: clamp(2.25rem, 8vw, 3.25rem); }
    .share-lede { color: var(--muted); font-weight: 300; line-height: 1.8; margin: 0 auto 28px; max-width: 46ch; }
    .share-greeting { font: italic 400 1.375rem/1.4 var(--display); color: var(--gold); margin-bottom: 24px; }
    .share-status { color: var(--muted); padding: 24px 0; }
    .share-status.is-problem { color: var(--ink); border: 1px solid var(--line); padding: 20px; line-height: 1.7; }
    #shareForm { text-align: left; }
    .share-photo { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 9; margin-bottom: 8px; border: 1px dashed var(--jade); color: var(--muted); cursor: pointer; overflow: hidden; text-align: center; padding: 16px; }
    .share-photo:hover, .share-photo:focus-within { border-color: var(--deep); color: var(--ink); }
    .share-photo:focus-within { outline: 2px solid var(--gold); outline-offset: 3px; }
    .share-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .share-photo.has-photo .share-photo-hint { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; background: rgba(14,14,16,.72); color: var(--ink); font-size: var(--fs-sm); }
    .share-photo-icon { display: block; width: 28px; height: 28px; margin: 0 auto 8px; }
    .share-count { align-self: flex-end; font-size: var(--fs-sm); color: var(--muted); }
    .share-field-error { font-size: var(--fs-sm); color: var(--ink); }
    .share-field-error::before { content: '— '; color: var(--gold); }
    .share-group-photo { margin-bottom: 28px; }
    .share-rating { border: 0; padding: 0; margin: 0 0 28px; }
    .share-rating legend { font-size: 0.6875rem; letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .share-stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 2px; }
    .share-stars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .share-stars label { display: grid; place-items: center; width: 44px; height: 44px; cursor: pointer; color: var(--jade); }
    .share-stars svg { width: 26px; height: 26px; }
    .share-stars input:checked ~ label, .share-stars label:hover, .share-stars label:hover ~ label { color: var(--gold); }
    .share-stars input:focus-visible + label { outline: 2px solid var(--gold); outline-offset: 2px; }
    .share-consent { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 28px; color: var(--muted); font-size: var(--fs-sm); line-height: 1.6; cursor: pointer; }
    .share-consent input { flex-shrink: 0; width: 22px; height: 22px; margin-top: 1px; accent-color: var(--gold); }
    .share-honeypot { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .share-error { margin-bottom: 16px; padding: 14px 16px; border: 1px solid var(--line); color: var(--ink); }
    #shareSubmit { width: 100%; }
    #shareSubmit[disabled] { opacity: .6; cursor: progress; }
    .share-done img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; margin: 8px 0 24px; }
    .share-done h2 { font: 400 2.25rem/1.1 var(--display); margin-bottom: 12px; }
    .share-done p { color: var(--muted); margin-bottom: 28px; }
    .share-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  </style>
</head>
<body class="share-page">
<header class="share-top">
  <a class="share-brand" href="./">
    <img src="img/druk-voyages-mark.svg?v=20261002-mainlogo" width="40" height="40" alt=""/>
    <img class="brand-wordmark" src="img/druk-voyages-wordmark.svg?v=20261002-mainlogo" width="180" height="17" alt="Druk Voyages"/>
  </a>
  <label class="share-lang"><span class="sr-only" data-s="language">Language</span>
    <select id="shareLang">
      <option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option><option value="ko">한국어</option>
      <option value="es">Español</option><option value="fr">Français</option><option value="vi">Tiếng Việt</option><option value="pt">Português</option>
    </select>
  </label>
</header>

<main class="share-main">
  <div class="section-label section-label-centered" data-s="label">Guest Stories</div>
  <h1 class="section-title" data-s-html="title">Share your best <em>moment</em></h1>
  <p class="share-lede" data-s="lede">One photo and a few words from your journey. Your story will appear among the guest stories on our website.</p>
  <p class="share-greeting" id="shareGreeting" hidden></p>
  <p class="share-status" id="shareStatus" role="status" data-s="checking">Checking your link…</p>

  <form id="shareForm" novalidate hidden>
    <div class="share-group-photo">
      <label class="share-photo" id="sharePhotoBox" for="sharePhoto">
        <img id="sharePreview" alt="" hidden/>
        <span class="share-photo-hint"><svg class="share-photo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="6" width="18" height="14"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><span data-s="photoHint">Tap to choose a photo</span></span>
        <input class="sr-only" type="file" id="sharePhoto" accept="image/*" aria-describedby="sharePhotoError"/>
      </label>
      <span class="sr-only" data-s="photo">Your photo</span>
      <p class="share-field-error" id="sharePhotoError" hidden></p>
    </div>
    <div class="form-group">
      <label for="shareName" data-s="name">Your first name</label>
      <input type="text" id="shareName" name="name" maxlength="40" autocomplete="given-name" required aria-describedby="shareNameError"/>
      <p class="share-field-error" id="shareNameError" hidden></p>
    </div>
    <div class="form-group">
      <label for="shareFrom" data-s="from">Where you’re from</label>
      <input type="text" id="shareFrom" name="from" maxlength="60" autocomplete="address-level2" required data-s-placeholder="fromPlaceholder" placeholder="e.g. Melbourne, Australia" aria-describedby="shareFromError"/>
      <p class="share-field-error" id="shareFromError" hidden></p>
    </div>
    <div class="form-group">
      <label for="shareText" data-s="story">Your best moment</label>
      <textarea id="shareText" name="text" rows="5" maxlength="400" required data-s-placeholder="storyPlaceholder" placeholder="What made this moment special?" aria-describedby="shareCount shareTextError"></textarea>
      <span class="share-count" id="shareCount" aria-live="polite">0/400</span>
      <p class="share-field-error" id="shareTextError" hidden></p>
    </div>
    <fieldset class="share-rating">
      <legend data-s="rating">Your rating</legend>
      <div class="share-stars">
        <input type="radio" name="rating" id="star5" value="5" checked/><label for="star5" data-star="5"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg><span class="sr-only">5 of 5 stars</span></label>
        <input type="radio" name="rating" id="star4" value="4"/><label for="star4" data-star="4"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg><span class="sr-only">4 of 5 stars</span></label>
        <input type="radio" name="rating" id="star3" value="3"/><label for="star3" data-star="3"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg><span class="sr-only">3 of 5 stars</span></label>
        <input type="radio" name="rating" id="star2" value="2"/><label for="star2" data-star="2"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg><span class="sr-only">2 of 5 stars</span></label>
        <input type="radio" name="rating" id="star1" value="1"/><label for="star1" data-star="1"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg><span class="sr-only">1 of 5 stars</span></label>
      </div>
    </fieldset>
    <label class="share-consent"><input type="checkbox" id="shareConsent" aria-describedby="shareConsentError"/><span data-s="consent">I agree that Druk Voyages may show my photo, first name, home town and story on its website.</span></label>
    <p class="share-field-error" id="shareConsentError" hidden></p>
    <div class="share-honeypot" aria-hidden="true"><label for="shareWebsite">Website</label><input type="text" id="shareWebsite" name="website" tabindex="-1" autocomplete="off"/></div>
    <p class="share-error" id="shareError" role="alert" hidden></p>
    <button type="submit" class="btn-primary" id="shareSubmit" data-s="submit">Share my moment</button>
  </form>

  <section class="share-done" id="shareDone" hidden>
    <img id="shareDonePhoto" alt=""/>
    <h2 data-s="doneTitle" tabindex="-1" id="shareDoneTitle">Thank you!</h2>
    <p id="shareDoneText" data-s="doneText">Your moment is now part of our guest stories.</p>
    <div class="share-actions">
      <button type="button" class="btn-primary" id="shareAnother" data-s="another" hidden>Share another moment</button>
      <a class="btn-outline" href="./#guest-stories" data-s="viewSite">Visit our website</a>
    </div>
  </section>
</main>
<script src="share-story.js?v=20261112-stories" defer></script>
<script src="sw-register.js?v=20261114-csp1"></script>
</body>
</html>
